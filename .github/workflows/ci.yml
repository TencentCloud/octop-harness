name: CI

# Pull requests only. GitHub runs PR checks on the merge result, so a push
# build on main would re-test content that the release / feature PR already
# proved green.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    # Post-release main → develop sync PRs carry main's already-tested tree.
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        # Skip bubblewrap on GitHub-hosted runners: unprivileged user namespaces
        # are often blocked ("bwrap: setting up uid map: Permission denied"),
        # and Linux bwrap integration tests already skip when bwrap is absent.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        env:
          # Isolate HOME so host PATH/PSModulePath entries under /root do not
          # trip PermissionError during local_shell path resolution on runners.
          HOME: /home/runner/harness-ci-home
          PSModulePath: ""
        run: |
          mkdir -p "$HOME"
          make test

  classified-memory-contract:
    name: Classified memory source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install released dependencies
        run: make install
      # The ordinary quality job checks the released dependency contract.
      # PR #42's additive API is not released yet. Keep this source test
      # pinned and replace it with a released minimum after memory adoption.
      - uses: actions/checkout@v7
        with:
          repository: TencentCloud/octop-memory
          ref: be59cd2b969a57d2dbfa5bbd79254626a2899843
          path: .ci/octop-memory
      - name: Install companion memory source
        run: uv pip install --python .venv/bin/python --no-deps -e .ci/octop-memory
      - name: Verify classified save contract
        run: |
          uv run --no-sync python -c "from inspect import signature; from octop_memory import MemoryService; assert 'kind' in signature(MemoryService.save).parameters"
          uv run --no-sync python -m pytest tests/test_memory_tools.py tests/test_memory_service_integration.py tests/test_memory_recall_boundary.py -q
